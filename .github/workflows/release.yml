name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle

      - name: Zip Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\packweaver.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe - Tauri build did not produce the binary" }
          $staging = "release-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe $staging\
          # Compress-Archive drops empty directories; seed so packweaver-data/instances survives.
          New-Item -ItemType Directory -Force -Path $staging\packweaver-data\instances | Out-Null
          New-Item -ItemType File -Force -Path $staging\packweaver-data\instances\.keep | Out-Null
          if (Test-Path Packweaver-Windows.zip) { Remove-Item Packweaver-Windows.zip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath Packweaver-Windows.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Packweaver-Windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
