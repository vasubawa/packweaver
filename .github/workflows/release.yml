name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install frontend dependencies
        run: pnpm install
        
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle

      - name: Zip Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging
          Copy-Item src-tauri\target\release\packweaver.exe release-staging\
          New-Item -ItemType Directory -Force -Path release-staging\packweaver-data\instances
          Compress-Archive -Path release-staging\* -DestinationPath Packweaver-Windows.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Packweaver-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
