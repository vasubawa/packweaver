name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'unstable'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Set dynamic application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $parts = $pkg.version.Split('.')
            $ver = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Setting application version to: $ver"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -NoNewline
          node scripts/sync-version.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'unstable' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'Packweaver v__VERSION__' || 'Packweaver (Unstable Preview)' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/v') && 'See the assets to download this version and install.' || 'Automated preview build from the main branch.' }}
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-') }}

      - name: Zip Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\packweaver.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe - Tauri build did not produce the binary" }
          $staging = "release-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe $staging\
          # Compress-Archive drops empty directories; seed so packweaver-data/instances survives.
          New-Item -ItemType Directory -Force -Path $staging\packweaver-data\instances | Out-Null
          New-Item -ItemType File -Force -Path $staging\packweaver-data\instances\.keep | Out-Null
          if (Test-Path Packweaver-Windows.zip) { Remove-Item Packweaver-Windows.zip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath Packweaver-Windows.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'unstable' }}
          files: |
            Packweaver-Windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
