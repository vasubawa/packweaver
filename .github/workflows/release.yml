name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf zip
        
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          
      - name: Install frontend dependencies
        run: pnpm install
        
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin --bundles app' || '--no-bundle' }}

      - name: Zip Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        run: Compress-Archive -Path src-tauri\target\release\packweaver.exe -DestinationPath Packweaver-Windows.zip

      - name: Zip Artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/release
          zip -j ../../../Packweaver-Linux.zip packweaver
          
      - name: Zip Artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          zip -r ../../../../../../../Packweaver-Mac.zip packweaver.app

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Packweaver-Windows.zip
            Packweaver-Linux.zip
            Packweaver-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
