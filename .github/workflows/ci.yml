name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Check Formatting
      run: pnpm format:check
      
    - name: Run Linter
      run: pnpm lint
      
    - name: Typecheck
      run: pnpm tsc --noEmit
      
    # Note: Tauri components require rust toolchains and specific system dependencies.
    # To avoid long build times for simple PRs, we currently only test the frontend.
    # - name: Run Tests
    #   run: pnpm test
